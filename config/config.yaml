# Environment-agnostic pipeline configuration.
# Secrets (API keys, tokens) live in .env, NOT here.

api:
  finnhub:
    base_url: "https://finnhub.io/api/v1"
    endpoints:
      quote: "/quote"
      profile: "/stock/profile2"
      # /stock/candle (historical OHLC) is paid-plan-only on Finnhub's free tier — not used.
      # Historical time series is instead built incrementally from daily quote snapshots.
    timeout_seconds: 10
    max_retries: 3
    retry_backoff_seconds: 2

tickers:
  # Universe of stocks pulled daily — kept small to stay well within free rate limits
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - NVDA
  - META
  - NFLX
  - JPM
  - V

delta:
  # Unity Catalog Volume paths — the governed storage location Databricks expects, and the
  # only one that works uniformly for both Spark I/O and plain file I/O on serverless compute.
  # Locally, etl.utils.paths ignores these and uses ./data/<layer> instead.
  raw_path: "/Volumes/workspace/default/lakehouse/raw"
  bronze_path: "/Volumes/workspace/default/lakehouse/bronze"
  silver_path: "/Volumes/workspace/default/lakehouse/silver"
  gold_path: "/Volumes/workspace/default/lakehouse/gold"

pipeline:
  partition_column: "ingestion_date"
  watermark_column: "event_timestamp"
