name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The radar pipeline and the API: pure Python, no Spark, fast.
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r radar/requirements.txt -r backend/requirements.txt pytest==8.2.2 httpx==0.28.1
      - name: Compile-check
        run: python -m compileall -q radar backend lakehouse
      - name: Run tests
        run: pytest tests/radar tests/backend -v

  # Bronze -> Silver -> Gold on a real local Spark + Delta session.
  lakehouse-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r lakehouse/requirements.txt pytest==8.2.2
      - name: Run tests
        run: pytest tests/lakehouse -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
