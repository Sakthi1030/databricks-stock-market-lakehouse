name: NSE News Radar

on:
  schedule:
    - cron: "0 8 * * 1-5"     # 13:30 IST: read the news, wait for 13:58, email the picks by ~14:00
    - cron: "15 10 * * 1-5"   # 15:45 IST: after the close, grade the previous day's picks
  workflow_dispatch:
    inputs:
      mode:
        description: "run = news + picks + email, outcomes = grade past picks"
        type: choice
        options: [run, outcomes]
        default: run
      test_email:
        description: "Send the email marked [TEST]"
        type: boolean
        default: false
      force:
        description: "Run even if NSE is closed today (uses the last session's prices)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (raw zone)
        uses: actions/checkout@v4
        with:
          ref: data
          path: radar-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt

      - run: pip install -r radar/requirements.txt pytest==8.2.2

      - run: pytest tests/radar -q

      - name: Run the radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then MODE=outcomes; else MODE=run; fi
            ARGS="--send"
          else
            MODE="${{ inputs.mode }}"
            ARGS="--no-wait"
            if [ "${{ inputs.test_email }}" = "true" ]; then ARGS="$ARGS --test-email"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          fi
          if [ "$MODE" = "outcomes" ]; then ARGS=""; fi
          echo "mode=$MODE args=$ARGS"
          python -m radar "$MODE" --data-dir radar-data $ARGS

      - name: Commit the data
        if: ${{ !cancelled() }}   # keep the picks even if the email step failed
        working-directory: radar-data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Radar data $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST"
          git push
